<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shadow Archive | İzleme Geçmişim</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root{
    --bg:#070b12;
    --card:#111827;
    --card2:#0f172a;
    --border:#1f2937;
    --text:#f9fafb;
    --muted:#94a3b8;
    --red:#ff2e63;
    --purple:#7c3aed;
    --blue:#00d4ff;
    --yellow:#facc15;
    --shadow:0 10px 35px rgba(0,0,0,.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:white;
       
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* Scrollbar */
::-webkit-scrollbar{
    width:10px;
}
::-webkit-scrollbar-thumb{
    background:linear-gradient(var(--purple),var(--blue));
    border-radius:20px;
}
::-webkit-scrollbar-track{
    background:#0b1120;
}

/* Hero */
.hero{
    padding:70px 20px 40px;
    text-align:center;
    position:relative;
}

.hero::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255, 255, 255, 0.18);
    filter:blur(120px);
    top:-180px;
    left:-100px;
    z-index:-1;
}

.hero h1{
    font-size:clamp(2.2rem,5vw,5rem);
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:15px;
    background:linear-gradient(90deg,#fff,#00d4ff,#ff2e63);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:var(--muted);
    max-width:700px;
    margin:0 auto 35px;
    font-size:1.05rem;
    line-height:1.7;
}

/* Search */
.search-box{
    width:min(700px,95%);
    margin:auto;
    position:relative;
}

.search-input{
    width:100%;
    height:68px;
    border:none;
    outline:none;
    padding:0 170px 0 25px;
    border-radius:22px;
    background:rgba(17,24,39,.85);
    backdrop-filter:blur(12px);
    color:white;
    font-size:1.05rem;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:var(--shadow);
    transition:.3s;
}

.search-input:focus{
    border-color:rgba(0,212,255,.5);
    box-shadow:
        0 0 0 4px rgba(0,212,255,.12),
        0 15px 45px rgba(0,0,0,.5);
}

.search-btn{
    position:absolute;
    top:8px;
    right:8px;
    height:52px;
    padding:0 28px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,var(--red),var(--purple));
    color:white;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 25px rgba(124,58,237,.35);
}

.search-btn:hover{
    transform:translateY(-2px) scale(1.03);
}

/* Status */
.Status{
    text-align:center;
    margin:30px auto;
    color:var(--muted);
    font-size:1rem;
    width:min(900px,90%);
    line-height:1.7;
}

/* Grid */
.movies{
    width:min(1500px,95%);
    margin:0 auto 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:28px;
}

/* Card */
.card{
    background:linear-gradient(180deg,#111827,#0b1220);
    border:1px solid rgba(255,255,255,.07);
    border-radius:24px;
    overflow:hidden;
    position:relative;
    transition:.35s;
    box-shadow:var(--shadow);
}

.card:hover{
    transform:translateY(-10px);
    border-color:rgba(0,212,255,.25);
}

.card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,transparent,rgba(255,46,99,.08));
    opacity:0;
    transition:.35s;
}

.card:hover::before{
    opacity:1;
}

.poster-wrapper{
    position:relative;
    overflow:hidden;
}

.poster{
    width:100%;
    height:390px;
    object-fit:cover;
    transition:transform .5s ease;
}

.card:hover .poster{
    transform:scale(1.05);
}

.rating{
    position:absolute;
    top:14px;
    right:14px;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    color:var(--yellow);
    font-weight:700;
    padding:8px 12px;
    border-radius:14px;
    font-size:.9rem;
    border:1px solid rgba(255,255,255,.08);
}

.card-info{
    padding:20px;
}

.title{
    font-size:1.1rem;
    font-weight:700;
    line-height:1.4;
    margin-bottom:12px;
}

.meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--muted);
    font-size:.92rem;
}

.type{
    background:rgba(124,58,237,.18);
    color:#c4b5fd;
    padding:6px 10px;
    border-radius:12px;
    font-size:.8rem;
    border:1px solid rgba(124,58,237,.3);
}

/* Loading */
.loader{
    width:50px;
    height:50px;
    border:4px solid rgba(255,255,255,.1);
    border-top-color:var(--blue);
    border-radius:50%;
    margin:35px auto;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* Footer */
footer{
    text-align:center;
    color:#64748b;
    padding:30px 15px 50px;
    font-size:.95rem;
}
</style>
</head>
<link rel="stylesheet" href="style.css" />
<body>
<header class="header">
        <div class="container header-container">
            <div class="Brand">
            <img src="image/logo.jpeg" alt="Logo" class="logo">
            <h2 class="title" style="color:rgb(0, 0, 0)">PROJE<span>ÖDEVİ</span></h2>
            </div>
            <nav class="nav-bar">
                <ul class="nav-links">
                    <li><a href="index.html" >Hakkında</a></li>
                    <li><a href="cv.html"  >Özgeçmiş</a></li>
                    <li><a href="#">Şehrim</a></li>
                    <li><a href="#">Mirasımız</a></li>
                    <li><a href="hobies.html" class="active nav">İlgi Alanlarım</a></li>
                    <li><a href="#">İletişim</a></li>
                    </li>
                </ul>
            </nav>
            <div class="account"><span class="account-name" style="color: black;">b2412100001<span class="status">Çevrim İçi</span></span>
            <button class="logout-btn" id="logout-btn"><i class="bi bi-box-arrow-right"></i></button></div>
            </div>
     </header>
<section class="hero">
    <h1>SHADOW ARCHIVE</h1>
    <p>
        Sadece benim izlediğim film, dizi ve animeleri arayabileceğin özel arşiv sistemi.
    </p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Batman, Loki, Death Note..."
            autocomplete="off"
        />

        <button class="search-btn" onclick="handleSearch()">
            Ara
        </button>
    </div>
</section>

<div class="Status" id="status">
    
</div>

<div class="movies" id="movies"></div>

<footer>
    Shadow Archive © 2026
</footer>

<script>
// API KEY
const API_KEY = "9e91c7d3";

// WATCH LIST

const myWatchedList = [ 
    // Diziler 
    "Arrow", "The Flash", "Supergirl", "DC's Legends of Tomorrow", "Black Lightning", "Lucifer",
    "Freedom Fighters: The Ray", "Vixen", "Batwoman", "Loki", "Moon Knight", "She-Hulk", "Daredevil",
    "The Punisher", "Iron Fist", "Secret Invasion", "Daredevil: Born Again", "Jessica Jones", 
    "Ms. Marvel", "Hawkeye", "WandaVision", "What If...?", "I Am Groot", "Agatha All Along", "Blade",
    "Superman & Lois", "The Sandman", "Smallville", "Titans", "Constantine", "Stargirl", "The Falcon and the Winter Soldier", 
    // Filmler
    "Iron Man", "Iron Man 2", "Iron Man 3", "Black Panther", "Black Panther: Wakanda Forever",
    "The Avengers", "Avengers: Age of Ultron", "Avengers: Infinity War", "Avengers: Endgame",
    "Justice League: The Flashpoint Paradox", "Justice League: War", "Son of Batman",
    "Justice League: Throne of Atlantis", "Batman vs. Robin", "Batman: Bad Blood",
    "Justice League vs. Teen Titans", "Justice League Dark", "Teen Titans: The Judas Contract",
    "Suicide Squad: Hell to Pay", "The Death of Superman", "Constantine: City of Demons",
    "Reign of the Supermen", "Batman: Hush", "Wonder Woman: Bloodlines", "Justice League Dark: Apokolips War",
    "The Dark Knight", "Man of Steel", "Superman", "The Incredible Hulk", "Hulk", "Thor", "Captain America: The First Avenger",
    "Thor: The Dark World", "Captain America: The Winter Soldier", "Guardians of the Galaxy", "Ant-Man", "Captain America: Civil War",
    "Doctor Strange", "Guardians of the Galaxy Vol. 2", "Spider-Man: Homecoming", "Thor: Ragnarok", "Ant-Man and the Wasp",
    "Captain Marvel", "Spider-Man: Far From Home", "Black Widow", "Shang-Chi and the Legend of the Ten Rings", "Eternals",
    "Spider-Man: No Way Home", "Doctor Strange in the Multiverse of Madness", "Thor: Love and Thunder",
    "The Guardians of the Galaxy Holiday Special", "Ant-Man and the Wasp: Quantumania", "Guardians of the Galaxy Vol. 3",
    "Deadpool & Wolverine", "Thunderbolts", "X-Men", "X2", "X-Men: The Last Stand", "X-Men Origins: Wolverine", "X-Men: First Class",
    "The Wolverine", "X-Men: Days of Future Past", "Deadpool", "X-Men: Apocalypse", "Logan", "Deadpool 2", "Dark Phoenix",
    "The New Mutants", 
    // Animasyonlar & Animeler 
    "Re:Zero", "Tokyo Ghoul", "Vinland Saga", "Attack on Titan", "Spy x Family", "Jujutsu Kaisen", "Solo Leveling", "Demon Slayer",
     "Miraculous: Tales of Ladybug & Cat Noir", "Death Note" ];

const moviesContainer = document.getElementById("movies");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

// SAYFA AÇILINCA TÜM İÇERİKLERİ YÜKLE
window.addEventListener("DOMContentLoaded", () => {
    fetchMovies(myWatchedList);
});

// ENTER
searchInput.addEventListener("keypress", (e)=>{
    if(e.key === "Enter"){
        handleSearch();
    }
});

// INPUT TEMİZLENİRSE HER ŞEYİ GERİ GETİR
searchInput.addEventListener("input", () => {

    const value = searchInput.value.trim();

    if(value === ""){
        fetchMovies(myWatchedList);
    }

});

// SEARCH
function handleSearch(){

    const query = searchInput.value.trim().toLowerCase();

    // BOŞSA TÜM İÇERİKLERİ GÖSTER
    if(!query){
        fetchMovies(myWatchedList);
        return;
    }

    const matched = myWatchedList.filter(item =>
        item.toLowerCase().includes(query)
    );

    if(matched.length === 0){

        moviesContainer.innerHTML = "";

        statusText.innerHTML =
        `"${query}" arşivimde bulunamadı.`;

        return;
    }

    fetchMovies(matched);

}

// FETCH
async function fetchMovies(list){

    moviesContainer.innerHTML = "";

    statusText.innerHTML = `
        <div class="loader"></div>
        Yapımlar yükleniyor...
    `;

    try{

        const requests = list.slice(0,50).map(title =>

            fetch(
                `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${API_KEY}`
            ).then(res => res.json())

        );

        const results = await Promise.all(requests);

        moviesContainer.innerHTML = "";

        results.forEach(movie => {

            if(movie.Response === "True"){
                createCard(movie);
            }

        });

        statusText.innerHTML =
        `Toplam ${results.length} yapım gösteriliyor.`;

    }catch(err){

        console.error(err);

        statusText.innerHTML =
        "Bir hata oluştu.";

    }

}

// CARD
function createCard(movie){

    const poster =
        movie.Poster !== "N/A"
        ? movie.Poster
        : "https://via.placeholder.com/500x750?text=Poster+Yok";

    const html = `
        <div class="card">

            <div class="poster-wrapper">

                <img
                    src="${poster}"
                    alt="${movie.Title}"
                    class="poster"
                >

                <div class="rating">
                    ★ ${movie.imdbRating !== "N/A"
                        ? movie.imdbRating
                        : "-"}
                </div>

            </div>

            <div class="card-info">

                <div class="title">
                    ${movie.Title}
                </div>

                <div class="meta">

                    <span>${movie.Year}</span>

                    <span class="type">
                        ${movie.Type.toUpperCase()}
                    </span>

                </div>

            </div>

        </div>
    `;

    moviesContainer.insertAdjacentHTML("beforeend", html);

}
</script>

</body>
</html>
